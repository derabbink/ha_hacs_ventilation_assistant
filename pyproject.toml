[project]
name = "ventilation-assistant"
version = "1.1.0"
requires-python = ">=3.13"

[dependency-groups]
lint = ["ruff"]
format = ["ruff"]
test = ["pytest"]
typecheck = [
    "aiohttp>=3.0",
    "defusedxml>=0.7",
    "homeassistant",
    "Jinja2>=3.1",
    "Pillow>=12.2.0",
    "ty",
]
dev = [
    {include-group = "lint"},
    {include-group = "typecheck"},
    {include-group = "test"},
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "SIM",   # flake8-simplify
    "C90",   # mccabe complexity
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "G",     # flake8-logging
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
]
ignore = [
    "RUF001", # ambiguous Unicode in strings (intentional: –, ×, etc.)
    "RUF002", # ambiguous Unicode in docstrings
    "RUF003", # ambiguous Unicode in comments
]

[tool.ruff.lint.mccabe]
max-complexity = 25
